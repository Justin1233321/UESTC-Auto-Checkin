name: Daily check-in

on:
  # 已停用 GitHub 的 schedule 触发。
  # 原因：GitHub 的定时调度不保证准时，实测出现数小时延迟甚至完全不触发，
  # 触发时常常落在打卡窗口外而失败，导致半夜收到无意义的失败邮件。
  #
  # 现改用 cron-job.org 等外部服务调用 workflow_dispatch API 触发，见 README。
  # 如需临时恢复 GitHub 定时，取消下面注释（cron 一律按 UTC 解释，
  # 北京时间减 8 小时）：
  #
  # schedule:
  #   - cron: "5 13 * * *"     # 21:05 北京
  #   - cron: "50 13 * * *"    # 21:50 北京
  #   - cron: "35 14 * * *"    # 22:35 北京
  #   - cron: "20 15 * * *"    # 23:20 北京
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - ticket
          - submit

permissions:
  contents: read

# 同一时间只允许一个实例；后到的排队而非并行，避免重复取票
concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Offline self-test (golden vectors)
        run: python -m uestc_wx.cli selftest

      - name: Materialize secrets
        # validate 不需要凭据，允许在配置 Secrets 之前先验证代码
        if: (github.event.inputs.mode || 'submit') != 'validate'
        env:
          YYB_CREDENTIALS_JSON: ${{ secrets.YYB_CREDENTIALS_JSON }}
          CHECKIN_PROFILE_JSON: ${{ secrets.CHECKIN_PROFILE_JSON }}
        run: |
          set -euo pipefail
          mkdir -p .private
          chmod 700 .private
          python - <<'PY'
          import os, pathlib
          private = pathlib.Path(".private")
          required = ("YYB_CREDENTIALS_JSON", "CHECKIN_PROFILE_JSON")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing secrets: " + ", ".join(missing) +
                  " (Settings -> Secrets and variables -> Actions)")
          (private / "creds.json").write_text(
              os.environ["YYB_CREDENTIALS_JSON"], encoding="utf-8")
          (private / "profile.json").write_text(
              os.environ["CHECKIN_PROFILE_JSON"], encoding="utf-8")
          print("secrets materialized")
          PY

      - name: Run check-in
        env:
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}
          BROWSER_FINGERPRINT: ${{ secrets.BROWSER_FINGERPRINT }}
          MODE: ${{ github.event.inputs.mode || 'submit' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            validate)
              echo "validate: 离线自检已通过，未发起平台请求"
              {
                echo "### validate 通过"
                echo "38 项黄金向量自检全部通过，未访问任何平台接口。"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            ticket)
              python -m uestc_wx.cli ticket --creds .private/creds.json
              ;;
            submit)
              # --wait-for-window：定时任务延迟到窗口外时，等待到窗口开启再打卡。
              # 最长等待 30 分钟，超过则退出，避免长时间占用 runner 额度。
              python -m uestc_wx.cli checkin \
                --creds .private/creds.json \
                --profile .private/profile.json \
                --student-id "$STUDENT_ID" \
                --password "$STUDENT_PASSWORD" \
                --fingerprint "$BROWSER_FINGERPRINT" \
                --wait-for-window \
                --max-wait-minutes 30
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Persist rotated credentials
        if: always() && (github.event.inputs.mode || 'submit') != 'validate'
        env:
          GH_TOKEN: ${{ secrets.CREDENTIALS_PAT }}
        run: python -m uestc_wx.persist || echo "persist step failed (non-fatal)"

      - name: Cleanup
        if: always()
        run: rm -rf .private
