name: Daily check-in

on:
  # 已停用 GitHub 的 schedule 触发。
  # 原因：GitHub 的定时调度不保证准时，实测出现数小时延迟甚至完全不触发，
  # 触发时常常落在打卡窗口外而失败，导致半夜收到无意义的失败邮件。
  #
  # 现改用 cron-job.org 等外部服务调用 workflow_dispatch API 触发，见 README。
  # 如需临时恢复 GitHub 定时，取消下面注释（cron 一律按 UTC 解释，
  # 北京时间减 8 小时）：
  #
  # schedule:
  #   - cron: "5 13 * * *"     # 21:05 北京
  #   - cron: "50 13 * * *"    # 21:50 北京
  #   - cron: "35 14 * * *"    # 22:35 北京
  #   - cron: "20 15 * * *"    # 23:20 北京
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - ticket
          - submit

permissions:
  contents: read

# 同一时间只允许一个实例；后到的排队而非并行，避免重复取票
concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore rotated credentials
        # 微信 refresh_token 每约 2 小时轮换，新值只存在于当次 runner。
        # 用 Actions cache 保存，避免依赖 PAT 回写 Secret。
        # 缓存丢失时回落到 Secret 里的初始凭据，refresh_token 仍有效即可自愈。
        if: (github.event.inputs.mode || 'submit') != 'validate'
        uses: actions/cache/restore@v4
        with:
          path: .private/config.json
          key: checkin-config-${{ github.run_id }}
          restore-keys: |
            checkin-config-

      - name: Install dependencies
        # selftest 也要 import cryptography，因此任何模式都必须安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Offline self-test (golden vectors)
        run: python -m uestc_wx.cli selftest

      - name: Materialize secrets
        # validate 不需要凭据，允许在配置 Secrets 之前先验证代码
        if: (github.event.inputs.mode || 'submit') != 'validate'
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
          CAS_ACCOUNT: ${{ secrets.CAS_ACCOUNT }}
        run: |
          set -euo pipefail
          mkdir -p .private
          chmod 700 .private
          python - <<'PY'
          import os, pathlib
          private = pathlib.Path(".private")
          required = ("CHECKIN_CONFIG", "CAS_ACCOUNT")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing secrets: " + ", ".join(missing) +
                  " (Settings -> Secrets and variables -> Actions)")
          (private / "cas.json").write_text(
              os.environ["CAS_ACCOUNT"], encoding="utf-8")
          # Secret 原文始终另存一份，作为缓存凭据失效时的回退源。
          # 缓存里的 refresh_token 可能已被轮换作废（-109），
          # 而 Secret 里这份只要还没被用过就仍然有效。
          (private / "config.secret.json").write_text(
              os.environ["CHECKIN_CONFIG"], encoding="utf-8")
          # 若 cache 未恢复出 config.json，才用 Secret 里的初始值
          config_path = private / "config.json"
          if not config_path.exists():
              config_path.write_text(
                  os.environ["CHECKIN_CONFIG"], encoding="utf-8")
              print("config from secret")
          else:
              print("config from cache (secret kept as fallback)")
          PY

      - name: Run check-in
        if: (github.event.inputs.mode || 'submit') != 'validate'
        env:
          MODE: ${{ github.event.inputs.mode || 'submit' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            ticket)
              python -m uestc_wx.cli ticket --config .private/config.json
              ;;
            submit)
              # --wait-for-window：若触发时恰好不在窗口内，等待到窗口开启再打卡。
              python -m uestc_wx.cli checkin \
                --config .private/config.json \
                --cas-config .private/cas.json \
                --wait-for-window \
                --max-wait-minutes 30
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Validate mode summary
        if: (github.event.inputs.mode || 'submit') == 'validate'
        run: |
          echo "validate: 离线自检已通过，未发起平台请求" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save rotated credentials
        if: always() && (github.event.inputs.mode || 'submit') != 'validate'
        uses: actions/cache/save@v4
        with:
          path: .private/config.json
          key: checkin-config-${{ github.run_id }}

      - name: Cleanup
        if: always()
        run: rm -rf .private
